name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      release_notes:
        description: 'Release notes'
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install build twine

    - name: Run tests before release
      run: |
        pytest tests/ -v --tb=short --maxfail=1

    - name: Build package
      run: |
        python -m build

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name || github.event.inputs.version }}
        release_name: Release ${{ github.ref_name || github.event.inputs.version }}
        body: |
          ## 🚀 Release ${{ github.ref_name || github.event.inputs.version }}

          ### Changes
          ${{ github.event.inputs.release_notes || 'Automated release of test automation framework' }}

          ### What's Included
          - ✅ Complete test automation framework
          - ✅ Page Object Model implementation
          - ✅ Allure reporting integration
          - ✅ CI/CD pipelines
          - ✅ Cross-browser support

          ### Installation
          ```bash
          pip install blazedemo-automation-${{ github.ref_name || github.event.inputs.version }}.tar.gz
          ```

          ### Quick Start
          ```bash
          git clone ${{ github.server_url }}/${{ github.repository }}.git
          cd ${{ github.event.repository.name }}
          pip install -r requirements.txt
          pytest tests/
          ```

        draft: false
        prerelease: ${{ contains(github.ref_name || github.event.inputs.version, 'beta') || contains(github.ref_name || github.event.inputs.version, 'alpha') }}

    - name: Upload release assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/blazedemo-automation-${{ github.ref_name || github.event.inputs.version }}.tar.gz
        asset_name: blazedemo-automation-${{ github.ref_name || github.event.inputs.version }}.tar.gz
        asset_content_type: application/gzip

    - name: Upload source distribution
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/blazedemo-automation-${{ github.ref_name || github.event.inputs.version }}.tar.gz
        asset_name: blazedemo-automation-${{ github.ref_name || github.event.inputs.version }}.tar.gz
        asset_content_type: application/gzip

    - name: Publish to PyPI (Optional)
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      run: |
        twine upload dist/* -u __token__ -p ${{ secrets.PYPI_API_TOKEN }}
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

    - name: Update documentation
      run: |
        echo "# Release ${{ github.ref_name || github.event.inputs.version }}" >> RELEASE_NOTES.md
        echo "- Date: $(date)" >> RELEASE_NOTES.md
        echo "- Commit: ${{ github.sha }}" >> RELEASE_NOTES.md
        echo "- Changes: ${{ github.event.inputs.release_notes || 'Framework updates and improvements' }}" >> RELEASE_NOTES.md
        echo "" >> RELEASE_NOTES.md

    - name: Commit release notes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add RELEASE_NOTES.md
        git commit -m "docs: update release notes for ${{ github.ref_name || github.event.inputs.version }}" || true
        git push

    - name: Release Summary
      run: |
        echo "## 🎉 Release Created Successfully" >> $GITHUB_STEP_SUMMARY
        echo "- **Version:** ${{ github.ref_name || github.event.inputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Release URL:** ${{ steps.create_release.outputs.html_url }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Package:** blazedemo-automation-${{ github.ref_name || github.event.inputs.version }}.tar.gz" >> $GITHUB_STEP_SUMMARY
        echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
